name: "Fast Redroid Android"

on:
  workflow_dispatch:
    inputs:
      vnc_password:
        required: true
        default: "redroid123"
      keepalive_min:
        required: false
        default: "60"

jobs:
  redroid:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      # ============ 1. Fast kernel module load ============
      - name: "Load binder modules"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq linux-modules-extra-$(uname -r) adb scrcpy xvfb x11vnc fluxbox novnc websockify wget curl
          sudo modprobe binder_linux devices="binder,hwbinder,vndbinder" 2>&1 || echo "binder fail"
          sudo modprobe ashmem_linux 2>&1 || echo "ashmem skipped"
          lsmod | grep -E "binder|ashmem" || echo "NO MODULES"
          echo "--- Kernel: $(uname -r) ---"

      # ============ 2. Pre-pull image (parallel) ============
      - name: "Pull Redroid image"
        run: |
          docker pull redroid/redroid:12.0.0_64only-latest &
          wait
          docker images | grep redroid

      # ============ 3. Fast container start ============
      - name: "Start Redroid (fast boot flags)"
        run: |
          docker run -d --privileged --name redroid \
            -p 5555:5555 \
            redroid/redroid:12.0.0_64only-latest \
            androidboot.redroid_gpu_mode=guest \
            androidboot.redroid_width=720 \
            androidboot.redroid_height=1280 \
            androidboot.redroid_dpi=240 \
            androidboot.redroid_fps=30 \
            androidboot.use_memfd=1 \
            androidboot.redroid_net_ndns=1 \
            androidboot.redroid_net_dns1=8.8.8.8 \
            androidboot.redroid_net_dns2=8.8.4.4 \
            androidboot.selinux=permissive
          
          echo "Container started"
          sleep 5
          docker logs redroid 2>&1 | tail -10

      # ============ 4. Fast boot wait (max 5 min) ============
      - name: "Wait for boot (max 5 min)"
        run: |
          adb kill-server || true
          adb start-server
          adb connect localhost:5555 || true

          # Total 5 min = 30 attempts x 10s
          for i in $(seq 1 30); do
            STATE=$(adb devices | grep 5555 | awk '{print $2}' | tr -d '\r')
            BOOT=$(adb -s localhost:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            echo "[$i/30] state=$STATE boot=$BOOT"
            
            if [ "$BOOT" = "1" ]; then
              echo "=== BOOTED in $((i*10))s ==="
              break
            fi
            adb connect localhost:5555 2>&1 || true
            sleep 10
          done

          adb devices
          adb -s localhost:5555 shell getprop ro.build.version.release || echo "still not ready"

      # ============ 5. Display + scrcpy ============
      - name: "Start display + scrcpy"
        run: |
          export DISPLAY=:99
          Xvfb :99 -screen 0 720x1280x24 &
          sleep 2
          fluxbox &
          sleep 2
          adb connect localhost:5555
          adb -s localhost:5555 wait-for-device
          scrcpy -s localhost:5555 --max-size 720 --stay-awake --window-title "Redroid" &
          sleep 8
          ps aux | grep scrcpy | grep -v grep

      # ============ 6. VNC + noVNC ============
      - name: "Start VNC + noVNC"
        run: |
          mkdir -p ~/.vnc
          x11vnc -storepasswd "${{ inputs.vnc_password }}" ~/.vnc/passwd
          x11vnc -display :99 -forever -shared -rfbauth ~/.vnc/passwd -rfbport 5900 -noxdamage &
          sleep 3
          websockify --web=/usr/share/novnc/ 6080 localhost:5900 > /tmp/novnc.log 2>&1 &
          sleep 3
          ss -tlnp | grep -E "5900|6080"

      # ============ 7. Cloudflare tunnel ============
      - name: "Start tunnel"
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared-linux-amd64
          sudo mv cloudflared-linux-amd64 /usr/local/bin/cloudflared
          
          cloudflared tunnel --url http://localhost:6080 --no-autoupdate > /tmp/cf.log 2>&1 &
          sleep 20
          
          URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cf.log | head -1)
          if [ -z "$URL" ]; then
            cat /tmp/cf.log
            exit 1
          fi
          
          echo "NOVNC_URL=$URL" >> $GITHUB_ENV
          echo ""
          echo "==============================================="
          echo "🟢 Android Redroid is LIVE"
          echo "🔗 Browser: $URL/vnc.html"
          echo "🔐 Password: ${{ inputs.vnc_password }}"
          echo "==============================================="

      # ============ 8. Keep alive ============
      - name: "Keep alive"
        run: |
          echo "Alive for ${{ inputs.keepalive_min }} min"
          echo "URL: ${{ env.NOVNC_URL }}/vnc.html"
          sleep $((${{ inputs.keepalive_min }} * 60))
